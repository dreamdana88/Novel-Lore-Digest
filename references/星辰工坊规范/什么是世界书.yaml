【知识库·世界书】
—— 为角色与世界赋予深度的动态知识系统

核心机制
世界书是宙之花造物工坊中的"知识熔炉"，用于在创作过程中动态插入背景信息。当特定关键词被触发时，相关内容将无缝整合到上下文中，为角色与世界构建提供精准的背景支撑。

底层原理
世界书条目的影响力遵循"距离定律"：
- 越靠近提示词末尾（对话历史底部），对AI生成内容的影响越强
- 越靠近提示词开头，越作为"背景知识"而非"行动指令"
- 插入位置决定了信息是"世界规则"还是"即时指令"

条目结构说明

【条目名称 Name】
应根据内容与性质进行分类命名（如：世界-魔法体系 | 角色-萧逸尘| 地点-杭州城）

【插入位置 Position】
决定条目在提示词结构中的位置，直接影响作用方式：

🔷 角色定义之前 (Before Character Definition)
- 技术位置：`world_info_before` 组件
- 作用范围：为整个世界设定基础规则
- 影响强度：中等，作为"世界法则"存在
- 适用内容：
• 宏观世界观（如女男平等的社会结构）
• 通用规则（如修仙等级体系）
• 物理法则（如魔法运作原理）
• 不直接与角色相关的背景设定

🔶 角色定义之后 (After Character Definition)
- 技术位置：`world_info_after` 组件
- 作用范围：影响角色行为与背景理解
- 影响强度：较强，直接塑造角色认知
- 适用内容：
• 角色所属组织的规则（如门派门规）
• 角色生活的环境（如城市风貌）
• 影响角色决策的社会背景
• 角色关系网中的其他人物设定

🔸 @D 深度位置 (At Depth)
- 技术位置：`chat_history` 组件内的特定深度
- 作用范围：作为对话消息插入聊天历史
- 影响强度：极强，越接近末尾影响越大
- 深度计算：D=0 为最近消息之前，D=4 为最近第4条消息位置
- 适用内容：
• 需要即时激活的临时规则
• 动态变化的环境描述
• 高优先级的行为指令
• 需要立即响应的世界状态变化

【插入顺序 Order】
数值越大，在同一位置内越靠近提示词末尾（影响力越强）
- 0-100：基础设定层（世界观骨架）
- 100-200：环境组织层（地域/势力）
- 200-400：角色相关层（人物设定/nsfw/线上人设/关系网/角色行为/日常生活等）
- 400-600：特殊事物/回忆（有意义的物品/特殊事件/角色回忆/历史信息总结等）
- 700+：核心机制层（状态栏/特殊系统）

【激活策略 Strategy】
🔵 常驻模式 (Always Active)
- 无需关键词触发，始终加载
- 适用于核心世界观、基础规则
- 消耗固定token，需谨慎使用
- 作用：作为"总览索引"，在Content中提及直接子条目的主关键词；更深层关键词由对应的🟢次级骨架承接

🟢 触发模式 (Key-based Activation)
- 通过关键词精确匹配激活
- 适用于具体设定、地点、次要角色、NPC
- 节省token，按需加载
- **关键要求：此类条目的主关键词必须出现在直接母条目的Content中；直接母条目可以是🔵常驻总览或🟢次级骨架。若直接母条目为🟢次级骨架，其主关键词还必须沿母子链追溯到🔵常驻根条目，否则成为"悬空条目"永不激活**

🟣 语义模式 (Semantic Activation)
- 通过内容相似性智能激活
- 适用于隐性关联、概念延伸
- 需向量数据库支持

【关键词 Keys】
触发条目激活的词汇列表（默认不区分大小写，支持正则表达式，用英文,分割）
- 示例：`清锋门,掌门,青峰山`
- 设计原则：覆盖核心概念及其同义词/关联词

【条目内容 Content】
条目被激活时插入的实际文本。需包含：
- 核心定义（是什么）
- 关键特征（有何特点）
- 关联要素（与其他设定的关系）

注意：只有Content字段会被插入上下文，Name/Keys等元数据仅用于触发判断。

递归激活铁律

⚠️ 避免"悬空条目"致命错误
悬空条目指：拥有🟢关键词触发策略的条目，其主关键词没有出现在直接母条目的Content中，或其母子链无法追溯到🔵常驻根条目。

**后果：** 该条目永远不会被激活，其描述的元素永远不会出现在故事中。

**适用范围：** 以下类型必须遵循"蓝灯索引→🔵/🟢次级骨架→绿灯详情"结构
- 世界中的组织/门派/国家
- 重要地点/城市/区域
- 特殊物品/技术/资源
- 拥有独立条目的重要NPC/敌人

**正确设计模式：**
1. 创建🔵常驻"总览条目"，在内容中提及直接子条目的主关键词
2. 按需创建🟢次级骨架条目，在内容中承接其直接子条目的主关键词
3. 为具体元素创建🟢关键词触发的详细条目
4. 确保每个🟢条目的主关键词出现在直接母条目的Content中，并能沿母子链追溯到🔵常驻根条目


世界观构建流程：
1. 锁定核心（🔵常驻）- 在"角色定义之前"设置基础世界观，作为总览索引
2. 丰富细节（🟢关键词）- 在"角色定义之后"设置具体元素，提供深度信息
3. 检查链接：验证每个🟢条目的主关键词均出现在直接母条目的Content中
4. 检查路径：验证每条母子链均能追溯到🔵常驻根条目

角色整合要点：
1. 角色背景应与世界观🔵条目保持一致
2. 角色所属组织/地点应有对应的🟢条目支撑
3. 利用"角色定义之后"位置植入角色行为逻辑的世界基础

避免常见错误：
- ❌ 创建🟢条目，但其主关键词未在直接母条目中出现，或母子链无法追溯到🔵常驻根条目（悬空条目）
- ❌ 在Content中使用"本条目介绍..."等元叙述
- ❌ 过度使用🔵常驻模式造成token浪费
- ❌ 关键词覆盖不足或过度泛化
- ❌ @D深度位置滥用，应仅用于真正需要即时响应的内容


